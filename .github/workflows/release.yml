name: release

# Triggered by a version tag (v*): build the Linux binary, package it and attach it to the GitHub Release created from
# that tag. Kept deliberately narrow - one target, no cross-compilation matrix - because this project's reproducibility
# story is "statically linked, runs anywhere", which crt-static gives us for free on ubuntu-22.04.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    env:
      # Single place the artifact name is built; $STAGE is then reused verbatim by package, notes and upload, so a typo
      # cannot make the sha256 refer to a file that was never created. Codegen flags live in the Build step, not here: see
      # the comment there for why RUSTFLAGS breaks proc-macro dependencies.
      STAGE: cdclq-${{ github.ref_name }}-linux-x86_64
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than left to the runner default so a release built today and one built in a year produce the same
      # codegen; rust-toolchain.toml is absent on purpose, CI owns this choice.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100'

      - uses: Swatinem/rust-cache@v2

      # `-C target-cpu=x86-64-v3` is the AVX2 baseline - this binary quantizes multi-GB models, so the SIMD GEMM width
      # matters - while staying runnable on any server CPU from 2014 on. `+crt-static` links glibc in, so the artifact does
      # not depend on the runner's glibc version and needs no matching runtime on the target machine.
      #
      # Both go through `cargo rustc -- --codegen`, never RUSTFLAGS, for two reasons that each cost a broken release once.
      # (1) RUSTFLAGS applies to every crate cargo compiles, and clap's derive macro is a proc-macro: a compiler plugin that
      # runs on the *build* machine, not in the shipped binary. `+crt-static` reaches into it and leaves it with a crate
      # type the host cannot load — "cannot produce proc-macro for clap_derive ... the target does not support these crate
      # types", exit 101, before any of our code is compiled. (2) RUSTFLAGS is also restricted to the top-level package, so
      # even without problem (1) it would skip the library where the GEMM kernels live and ship a binary whose hot loops
      # have no AVX2. Flags after `--` go to rustc for one named target only, and do not invalidate cargo's dependency cache.
      #
      # That means two explicit invocations: cargo refuses extra rustc arguments when more than one target is selected, so
      # the lib and the bin are compiled separately with the same codegen pair. `--all-targets` is therefore not used here;
      # lib + bin is the whole artifact (tests are validated in the next step and never shipped).
      - name: Build
        run: |
          CG="--codegen target-cpu=x86-64-v3 --codegen target-feature=+crt-static"
          cargo rustc --release --locked --lib -- $CG
          cargo rustc --release --locked --bin cdclq -- $CG

      # Plain `cargo test`: the suite validates behaviour, and codegen flags must not be what makes a test pass or fail.
      # `--all-targets` compiles the integration-test binary as well, which plain `cargo test` builds anyway but is explicit
      # about here so a regression in tests/toy_models.rs cannot ship unnoticed.
      - name: Test
        run: cargo test --release --locked --all-targets

      # The real check is that the binary runs, not that it linked: --version exercises argument parsing and startup with no
      # model files needed. Everything after it is diagnosis of the static link.
      #
      # Eleven attempts failed here showing only "Process completed with exit code 1", and each taught one fact worth keeping:
      #   - ldd's exit status is not a verdict. It exits non-zero on binaries it declines to inspect, and prints its complaint
      #     on stdout rather than stderr.
      #   - Requiring no INTERP program header and no DT_NEEDED entry was simply wrong: a +crt-static binary built for a gnu
      #     target has both while still loading nothing from disk at run time, so that check rejected every good build.
      #   - Actions runs the block as `bash --norc -n -o pipefail -e`, and -e is narrower than its name suggests: it aborts on
      #     a failing command inside a function and on an unbound expansion in a redirect target, but not on ordinary failing
      #     simple commands. Every earlier version guessed at which shape would trip it.
      #   - The failure itself was never the problem; the silence was. Anything printed before the abort is gone from the logs
      #     we can reach without a token, and $GITHUB_STEP_SUMMARY needs one too, so ten runs taught us nothing observable.
      #
      # Hence the shape below: probes whose output lands in files through redirection only, evidence read back with plain
      # `cat` into stdout, and verdicts as literal strings. What can still fail the step is only what is worth failing on - no
      # artifact, an artifact that does not exit 0 on --version, or a library resolved to a path on disk ("name => path"),
      # which is the condition that actually breaks on an older distro.
      - name: Inspect the artifact
        run: |
          # The first line of this step must be readable no matter what happens afterwards, so it is a bare echo: nothing
          # before it can abort the block. Eleven attempts have died in under a second with only "Process completed with exit
          # code 1" to show for it, which means the script is ending before its first real command - and the only way to find
          # out why is to make the runner describe itself before anything else runs.
          echo "step-start sentinel: shell=$0 opts=$- pwd=$PWD user=$(id -un 2>/dev/null || echo unknown)"
          ls -l ./target/release/ || true

          BIN=./target/release/cdclq
          # The evidence goes into files under the checkout, then reaches the log through `cat` on stdout. Earlier versions
          # wrote it into $GITHUB_STEP_SUMMARY, which is the one place nobody can read: the job summary needs a token and
          # unauthenticated requests return 403, so ten runs failed while their own explanations sat in a file neither of us
          # could open.
          D="$GITHUB_WORKSPACE/artifact-evidence"
          rm -rf "$D" || true
          mkdir -p "$D" || true

          # Each probe writes three files - stdout, stderr and its exit status - using redirection only, so a tool missing
          # from the image becomes text in its own report instead of an invisible abort. `|| rc=$?` takes the status from the
          # command itself; `$?` read after any intervening command belongs to that command instead.
          probe() { name="$1"; shift; rc=0; "$@" > "$D/$name.txt" 2> "$D/$name.err" || rc=$?; echo "$rc" > "$D/$name.status"; }
          probe version "$BIN" --version || true
          probe ldd ldd "$BIN" || true
          probe elf-header readelf -h "$BIN" || true
          probe prog-headers readelf -l "$BIN" || true
          probe dynamic readelf -d "$BIN" || true
          probe file-type file "$BIN" || true

          # The evidence, one `cat` with an explicit path per section and never a loop variable: the printed line then names
          # the file it opened, so a wrong probe name shows up as a missing section rather than six copies of one answer.
          echo "=== artifact evidence: $(ls -l "$BIN" 2>/dev/null || echo 'no binary') ==="
          echo "--- version status ---"; cat "$D/version.status" || true
          echo "--- version stdout ---"; cat "$D/version.txt" || true
          echo "--- version stderr ---"; cat "$D/version.err" || true
          echo "--- ldd status ---"; cat "$D/ldd.status" || true
          echo "--- ldd stdout ---"; cat "$D/ldd.txt" || true
          echo "--- ldd stderr ---"; cat "$D/ldd.err" || true
          echo "--- readelf -h status ---"; cat "$D/elf-header.status" || true
          echo "--- readelf -h output ---"; cat "$D/elf-header.txt" || true
          echo "--- readelf -l status ---"; cat "$D/prog-headers.status" || true
          echo "--- readelf -l output ---"; cat "$D/prog-headers.txt" || true
          echo "--- readelf -d status ---"; cat "$D/dynamic.status" || true
          echo "--- readelf -d output ---"; cat "$D/dynamic.txt" || true
          echo "--- file status ---"; cat "$D/file-type.status" || true
          echo "--- file output ---"; cat "$D/file-type.txt" || true

          # The verdicts, as literal strings through echo, kept after the evidence so that even a failing check leaves
          # everything above it readable in the log.
          if [ ! -f "$BIN" ]; then
            echo "step verdict: FAIL - $BIN was not produced by the build"
            exit 1
          fi
          # --version not exiting 0 means the artifact cannot run at all, which outranks any linkage question.
          if ! grep -qx 0 "$D/version.status"; then
            echo "step verdict: FAIL - \`--version\` did not exit 0, so the artifact cannot run regardless of linkage"
            exit 1
          fi
          # The one linkage assertion, phrased so it does not depend on how a given ldd describes a static binary: fail only
          # when something was actually resolved to a path on disk.
          if grep -q '=>' "$D/ldd.txt"; then
            echo "step verdict: FAIL - ldd resolved a shared dependency to a path, +crt-static did not take effect"
            exit 1
          fi
          echo "step verdict: PASS - the binary runs and no shared dependency resolved to a path"
          exit 0

      # A tar.gz with a single top-level directory, so extracting it never scatters files into the caller's cwd. The name
      # carries the tag (refs/tags/v1.2.3 -> cdclq-v1.2.3-linux-x86_64) so an asset cannot be mistaken for another
      # release's; Cargo.toml should be bumped to match the tag, and `cdclq --version` prints that same version.
      - name: Package
        run: |
          mkdir -p "$STAGE" dist
          cp target/release/cdclq "$STAGE/cdclq"
          cp README.md Cargo.toml Cargo.lock "$STAGE/"
          if [ -f LICENSE ]; then cp LICENSE "$STAGE/LICENSE"; fi
          tar -czf "dist/$STAGE.tar.gz" "$STAGE"
          ( cd dist && sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256" )
          ls -l dist

      # Notes are written here rather than left to generate_release_notes: with direct pushes to main there are no PRs to
      # list, and what a downloader needs is the digest plus the build flags that decide whether the binary runs at all.
      # Backticks come from a variable so bash cannot read them as command substitution inside the fenced block.
      # The wording here has to match what the smoke step proved, not what we wish +crt-static did. On a gnu target the flag
      # pulls glibc into the executable but keeps an ELF interpreter, so "no runtime dependency" would be an overstatement:
      # the honest claim is that no library gets resolved from disk at run time, which is what actually protects an older
      # distro. The build command is quoted as it really runs (two `cargo rustc` invocations), because a reader comparing
      # this note with their own reproducible build should see the same thing CI did.
      - name: Release notes
        run: |
          BT='`'
          {
            echo "Linux x86-64 binary for CDCL-GPTQ."
            echo
            echo "${BT}${BT}${BT}"
            cat "dist/$STAGE.tar.gz.sha256"
            echo "${BT}${BT}${BT}"
            echo
            echo "- Statically linked (${BT}+crt-static${BT}): glibc is inside the executable, so no shared library is loaded at run time and the binary does not track the build machine's glibc version."
            echo "- Built for x86-64-v3 (AVX2): needs a CPU from 2014 or newer."
            echo "- Toolchain: Rust stable 1.100, ${BT}cargo rustc --release --locked --lib/--bin cdclq -- --codegen target-cpu=x86-64-v3 --codegen target-feature=+crt-static${BT}, fat LTO."
          } > dist/NOTES.md
          cat dist/NOTES.md

      # softprops/action-gh-release creates the release from the tag if it does not exist yet, so pushing a tag is the
      # only human step needed. fail_on_missing_files makes an empty glob (packaging broke) an error instead of an empty
      # release with no assets.
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body_path: dist/NOTES.md
          fail_on_missing_files: true
