[package]
name = "cdclq"
version = "1.0.0"
edition = "2021"
description = "CDCL-GPTQ: conflict-driven, Hessian-exact post-training weight quantizer"
license = "MIT"

[lib]
name = "cdclq"
path = "src/lib.rs"

[[bin]]
name = "cdclq"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.86"
clap = { version = "=4.4.18", features = ["derive"] }
half = "=2.4.1"
matrixmultiply = "=0.3.8"
memmap2 = "=0.9.4"
rayon = "=1.8.1"
safetensors = "=0.4.3"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.test]
opt-level = 2
